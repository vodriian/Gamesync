[package]
name = "gamesync-desktop"
version = "0.1.0"
edition = "2021"
description = "A cozy native game library"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
tempfile = "=3.27.0"
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
notify = "=7.0.0"

# Use system Metal on startup; do not require Apple's separate Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
