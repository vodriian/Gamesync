[package]
name = "gamesync-desktop"
version = "0.1.0"
edition = "2021"
description = "A cozy native game library"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
tempfile = "=3.27.0"
uuid = { version = "=1.26.0", features = ["v4", "v5", "serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
notify = "=7.0.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

# Use system Metal on startup; do not require Apple's separate Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3

# GameSync card compositing extension; base version remains 0.2.2.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
