[package]
name = "gamesync-desktop"
version = "0.1.0"
edition = "2021"
description = "A cozy native game library"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
futures = "0.3"
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
